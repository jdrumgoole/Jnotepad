[project]
name = "jnotepad"
version = "0.1.0"
description = "Capture notes, links and images. FastAPI + regstack auth + SecantusDB storage."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Joe Drumgoole", email = "joe@joedrumgoole.com" }]
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.29",
    "regstack[mongo]==0.9.3",
    # SecantusDB only ships pre-releases; pin so an upgrade is deliberate.
    "secantusdb==0.7.0b3",
    "pymongo>=4.13",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
jnotepad = "jnotepad.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jnotepad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]  # B008: FastAPI Depends()/File() defaults

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107", "E501"]
